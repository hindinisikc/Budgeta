# Netlify build settings for Budgeta (static site, no server).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / TypeScript 7 need a current Node.
  NODE_VERSION = "22"

# The service worker and its manifest must never be cached, or phones won't see new versions.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The page itself must be revalidated so a new deploy's asset names are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    # Netlify serves .webmanifest as application/octet-stream by default; iOS is strict about installability.
    Content-Type = "application/manifest+json"

# Hashed build assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
