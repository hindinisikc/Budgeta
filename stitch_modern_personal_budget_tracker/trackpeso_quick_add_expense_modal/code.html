<!-- Interactive Script for Quick Operations -->
<script>
    (function initQuickExpenseModal() {
      const amountInput = document.getElementById('amountInput');
      const btnLabel = document.getElementById('btnLabel');
      const mainSubmitBtn = document.getElementById('mainSubmitBtn');
      const headerSaveBtn = document.getElementById('headerSaveBtn');
      const descInput = document.getElementById('descInput');
      const selectedCategoryLabel = document.getElementById('selectedCategoryLabel');
      const receiptFileInput = document.getElementById('receiptFileInput');
      const receiptStatus = document.getElementById('receiptStatus');
      const dateDisplay = document.getElementById('dateDisplay');
      const dateToggleBtn = document.getElementById('dateToggleBtn');

      // Update CTA with current amount
      function updateButton() {
        const val = parseFloat(amountInput.value) || 0;
        btnLabel.textContent = `Add ₱${val.toFixed(2)} Expense`;
      }

      amountInput.addEventListener('input', updateButton);

      // Quick denomination buttons (+50, +100, etc.)
      document.querySelectorAll('.denom-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          const addVal = parseFloat(btn.getAttribute('data-add')) || 0;
          const currentVal = parseFloat(amountInput.value) || 0;
          amountInput.value = (currentVal + addVal).toFixed(2);
          updateButton();
          
          // Haptic-like visual response
          amountInput.classList.add('scale-105');
          setTimeout(() => amountInput.classList.remove('scale-105'), 120);
        });
      });

      // Quick suggest description pills
      document.querySelectorAll('.suggest-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const text = chip.getAttribute('data-desc');
          descInput.value = text;
          
          // Auto select smart matching category if appropriate
          if (text === 'Groceries') selectCategoryByName('Groceries');
          if (text === 'Coffee' || text === 'Dinner' || text === 'Snack') selectCategoryByName('Food & Dining');
          if (text === 'Transport') selectCategoryByName('Transportation');
        });
      });

      // Category Pill selection
      const catButtons = document.querySelectorAll('.cat-pill');
      function selectCategoryByName(catName) {
        catButtons.forEach(b => {
          const isMatch = b.getAttribute('data-cat') === catName;
          if (isMatch) {
            b.className = 'cat-pill flex flex-col items-center justify-center p-2.5 rounded-xl bg-primary text-on-primary transition-all active:scale-95';
            const icon = b.querySelector('.material-symbols-outlined');
            if (icon) icon.className = 'material-symbols-outlined text-2xl mb-1 text-on-primary';
            selectedCategoryLabel.textContent = catName;
          } else {
            b.className = 'cat-pill flex flex-col items-center justify-center p-2.5 rounded-xl bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-95';
            const icon = b.querySelector('.material-symbols-outlined');
            if (icon) icon.className = 'material-symbols-outlined text-2xl mb-1 text-secondary';
          }
        });
      }

      catButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.getAttribute('data-cat');
          selectCategoryByName(cat);
        });
      });

      // Payment method selection
      const payButtons = document.querySelectorAll('.pay-chip');
      payButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          payButtons.forEach(p => {
            p.className = 'pay-chip flex items-center gap-1.5 px-3 py-2 rounded-xl bg-surface-container text-on-surface-variant hover:bg-surface-container-high text-xs font-semibold shrink-0 transition-all active:scale-95';
            const icon = p.querySelector('.material-symbols-outlined');
            if (icon) icon.className = 'material-symbols-outlined text-sm text-secondary';
          });
          btn.className = 'pay-chip flex items-center gap-1.5 px-3 py-2 rounded-xl bg-primary text-on-primary text-xs font-bold shrink-0 transition-all active:scale-95';
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon) icon.className = 'material-symbols-outlined text-sm text-on-primary';
        });
      });

      // Receipt attach simulation
      if (receiptFileInput) {
        receiptFileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            receiptStatus.textContent = e.target.files[0].name.slice(0, 10) + '...';
            receiptStatus.classList.add('text-primary');
          }
        });
      }

      // Date toggle (flip between Today & Yesterday)
      if (dateToggleBtn) {
        let isToday = true;
        dateToggleBtn.addEventListener('click', () => {
          isToday = !isToday;
          dateDisplay.textContent = isToday ? 'Today, Jun 24' : 'Yesterday, Jun 23';
        });
      }

      // Save submission handler
      function handleSave() {
        const val = parseFloat(amountInput.value) || 0;
        if (val <= 0) {
          amountInput.focus();
          return;
        }
        btnLabel.innerHTML = 'Saved! ✓';
        mainSubmitBtn.classList.remove('bg-primary');
        mainSubmitBtn.classList.add('bg-primary-container', 'text-on-primary-fixed-variant');
        setTimeout(() => {
          history.back();
        }, 350);
      }

      mainSubmitBtn.addEventListener('click', handleSave);
      headerSaveBtn.addEventListener('click', handleSave);
    })();
  </script>
</div></main></body></html>
